<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>PDF Marker</title>
</head>
<body>
    <div class="app-container">
        <h1>
            📄 PDF 关键字搜索标记工具
            <small>v2.1</small>
        </h1>

        <!-- ===== 设置区 ===== -->
        <div class="settings">
            <div class="setting-group">
                <label for="modelSelect">文本识别模型 OCRmodel:</label>
                <select id="modelSelect">
                    <option value="tesseractOCR">tesseractOCR</option>
                    <option value="paddleOCR">paddleOCR</option>    
                </select>
                <small> ( paddleOCR is better but slower )</small>
            </div>
            <div class="setting-group">
                <label for="keywordInput">搜索关键字/词 Keyword:</label>
                <input type="text" id="keywordInput" value="NEW VAM"></input>
            </div>
            <div class="setting-group">
                <label for="capitalToggle">区分大小写 Case sensitive:</label>
                <input type="checkbox" id="capitalToggle" unchecked></input>
            </div>
            <div class="setting-group">
                <label for="leniencyInput">分段宽容度 Parsing leniency:</label>
                <input type="number" id="leniencyInput" value="1" min="0" max="10"></input>
            </div>
            <div class="setting-group">
                <label for="outputDirInput">输出文件地址 Output Directory:</label>
                <input type="text" id="outputDirInput" placeholder="Select output directory" readonly></input>
                <button type="button" id="selectOutputDirBtn">📁</button>
            </div>
            <div class="setting-group">
                <label for="outputNameInput">输出文件名称 Output File Name:</label>
                <input type="text" id="outputNameInput" placeholder="Enter output file name" value="MarkedPDF"></input>
            </div>
        </div>

        <div class="file-select">
            <label for="fileInput">选择文件 Select Files ➔</label>
            <button type="button" id="fileInput">📁</button>
        </div>

        <!-- ===== 文件列表 ===== -->
        <div class="file-list-wrapper">
            <div class="file-list-header">
                <span>已选择文件 Selected Files</span>
                <span id="orderHint">点上下键给文件排序 Click up/down button to sort</span>
            </div>
            <ul class="file-list" id="fileList">
                <li class="empty-message">未选择任何文件 No files selected</li>
            </ul>
        </div>

        <!-- ===== 操作按钮 ===== -->
        <div class="action-row">
            <button class="btn-mark" id="markBtn">标注PDF Annotate PDF</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
